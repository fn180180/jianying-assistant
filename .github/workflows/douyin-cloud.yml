name: Analyze Douyin in Cloud

on:
  push:
    branches: [feature/douyin-cloud-analyzer]
    paths:
      - '.github/workflows/douyin-cloud.yml'
  workflow_dispatch:
    inputs:
      video_url:
        description: '抖音影片分享文字或 AnyToCopy 直鏈'
        type: string
        required: true
      focus:
        description: '分析重點；例如男生三餐、熱量、體重'
        type: string
        required: false
        default: '男生六哥的低脂三餐和體重'

permissions:
  contents: read

jobs:
  cloud-video-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
      WHISPER_MODEL: base
      VIDEO_URL: ${{ inputs.video_url || 'https://v26-default.365yg.com/6128bd030a0a4ea0f3ee12e16ba44256/6acdcdd7/video/tos/cn/tos-cn-ve-15/o8sHmIggQIwUezWBgPVBbGRCmIGeG5YeAAqLG7/?a=6383&ch=26&cr=3&dr=0&lr=all&cd=0%7C0%7C0%7C3&cv=1&br=734&bt=734&cs=2&ds=4&ft=HImFM68nffPdHK~2N12NvAq-antLjrKTwmNuRka~oJbmvjVhWL6&mime_type=video_mp4&qs=15&rc=ZWUzPDk7Ojk3Ojk6OTk7OUBpM3I8ZWw5cmpqZTMzNGkzM0BeMzQwMmJfXzIxMGBfYDJhYSM1bW0yMmRzNjNhLS1kLTBzcw%3D%3D&btag=c0000e00028000&cquery=100w_100B_100x_100z_100o&dy_q=1791861547&feature_id=d86bd754948bc17d2db98d02df5c6710&l=20261013111907FD27B0E3301D51CDCDFE' }}
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Chinese OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-chi-sim

      - name: Python libraries
        run: |
          python -m pip install -r douyin-cloud-analyzer/requirements.txt pytest

      - name: Run unit tests
        run: |
          python -m pytest douyin-cloud-analyzer/cloud_douyin/tests -q

      - name: Download video and analyze in cloud runner
        id: analyze
        continue-on-error: true
        run: |
          mkdir -p output
          python douyin-cloud-analyzer/cloud_douyin/analyze.py --url "$VIDEO_URL" --output output

      - name: Show text report in Actions Summary
        if: always()
        run: |
          if [ -f output/report.md ]; then
            head -n 120 output/report.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "完整 OCR、逐字稿與 JPG 分鏡圖請下載本次 Artifact。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 未產生分析報告，請查看執行日誌。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload only text and contact sheets, no MP4/WAV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-visual-analysis-${{ github.run_number }}
          path: |
            output/report.md
            output/report.json
            output/ocr.json
            output/transcript.txt
            output/visual_evidence/*.jpg
          if-no-files-found: warn
          retention-days: 1

      - name: Fail workflow if download or analysis failed
        if: steps.analyze.outcome == 'failure'
        run: exit 1
